<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embed demo</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;display:grid;gap:1.5rem}</style></head>
<body>
  <h1>Embed demo</h1>
  <!-- Widget: copy these lines anywhere -->
  <div data-portal="announcements" data-limit="2"></div>
  <div data-portal="schedule" data-theme="light" data-limit="3"></div>
  <script src="js/data.js"></script>
  <script src="js/embed.js"></script>
  <!-- Iframe: one section of the site, nav + footer hidden -->
  <iframe src="index.html?embed#resources" title="Resources" style="width:100%;height:520px;border:1px solid #223044;border-radius:12px"></iframe>
</body></html>
